spring.config.import=optional:file:./.env.properties
spring.application.name=CampusLink
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campuslink}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=65MB

app.jwt.secret=${JWT_SECRET}app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.upload-dir=${UPLOAD_DIR:uploads}
app.private-upload-dir=${PRIVATE_UPLOAD_DIR:private-uploads}
app.university-email-domain=${UNIVERSITY_EMAIL_DOMAIN:uiu.ac.bd}
app.admin.email=${ADMIN_EMAIL:admin@campuslink.edu}
app.admin.password=${ADMIN_PASSWORD}
